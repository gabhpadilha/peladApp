<body style="margin:0;background:transparent">
<script type="module">
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const SIZE = 384;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setSize(SIZE, SIZE);
renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
const env = pmrem.fromScene(new RoomEnvironment(), 0.02).texture;

/** Lapidação brilhante: coroa com mesa, cintura fina e pavilhão, 8 facetas (LatheGeometry + flatShading). */
function brilliantGeometry(segments = 8) {
  const profile = [
    [0.0, -1.0],
    [0.98, 0.1],
    [1.0, 0.22],
    [0.66, 0.62],
    [0.0, 0.62],
  ].map(([x, y]) => new THREE.Vector2(x, y));
  return new THREE.LatheGeometry(profile, segments);
}

const GEMS = {
  // comum: pedra de aço lapidada, sem brilho exagerado
  comum: { color: 0x5f7389, emissive: 0x0a1118, rough: 0.3, metal: 0.45, inner: false, ring: false, prongs: false, segments: 6, exposure: 0.85 },
  // rara: safira azul com brilho próprio
  rara: { color: 0x1458ff, emissive: 0x041a66, rough: 0.1, metal: 0.1, inner: true, ring: false, prongs: false, segments: 8, exposure: 0.85 },
  // épica: ametista com anel orbital
  epica: { color: 0x8a22ff, emissive: 0x2a0770, rough: 0.1, metal: 0.1, inner: true, ring: true, prongs: false, segments: 8, exposure: 0.85 },
  // lendária: gema dourada engastada em garras, com anel e aura
  lendaria: { color: 0xff9d00, emissive: 0x6a3000, rough: 0.1, metal: 0.2, inner: true, ring: true, prongs: true, segments: 8, exposure: 0.9 },
};

function build(kind) {
  const cfg = GEMS[kind];
  const scene = new THREE.Scene();
  scene.environment = env;
  const group = new THREE.Group();

  const outer = new THREE.Mesh(
    brilliantGeometry(cfg.segments),
    new THREE.MeshPhysicalMaterial({
      color: cfg.color, emissive: cfg.emissive, emissiveIntensity: 0.7, roughness: cfg.rough, metalness: cfg.metal,
      clearcoat: 0.6, clearcoatRoughness: 0.08, envMapIntensity: 0.9, flatShading: true,
    }),
  );
  group.add(outer);

  if (cfg.inner) {
    const core = new THREE.Mesh(
      brilliantGeometry(cfg.segments),
      new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: cfg.color, emissiveIntensity: 1.1, roughness: 0.2, metalness: 0, flatShading: true, transparent: true, opacity: 0.28 }),
    );
    core.scale.set(0.58, 0.58, 0.58);
    core.rotation.y = Math.PI / cfg.segments;
    group.add(core);
  }

  const goldMat = new THREE.MeshStandardMaterial({ color: 0xe9c46a, metalness: 1, roughness: 0.22, envMapIntensity: 2.4 });
  if (cfg.ring) {
    const ring = new THREE.Mesh(new THREE.TorusGeometry(1.55, 0.045, 12, 96), kind === "lendaria" ? goldMat : new THREE.MeshStandardMaterial({ color: 0xc9a8ff, metalness: 1, roughness: 0.25, envMapIntensity: 2.4 }));
    ring.rotation.x = Math.PI / 2.35;
    ring.rotation.z = 0.25;
    group.add(ring);
  }
  if (cfg.prongs) {
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * Math.PI * 2 + Math.PI / 4;
      const prong = new THREE.Mesh(new THREE.ConeGeometry(0.15, 0.7, 12), goldMat);
      prong.position.set(Math.cos(a) * 1.0, 0.22, Math.sin(a) * 1.0);
      prong.rotation.z = -Math.cos(a) * 0.35;
      prong.rotation.x = Math.sin(a) * 0.35;
      group.add(prong);
    }
    const band = new THREE.Mesh(new THREE.TorusGeometry(1.02, 0.07, 10, 64), goldMat);
    band.rotation.x = Math.PI / 2;
    band.position.y = 0.16;
    group.add(band);
  }

  group.rotation.set(0.42, 0.5, 0.08);
  scene.add(group);

  const key = new THREE.DirectionalLight(0xffffff, 1.9);
  key.position.set(2.5, 3.5, 3);
  const rim = new THREE.DirectionalLight(cfg.color, 1.6);
  rim.position.set(-3, 1.5, -2.5);
  scene.add(key, rim);
  return scene;
}

const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 50);
camera.position.set(0, 0.35, 7.2);
camera.lookAt(0, 0, 0);

window.renderAll = () => {
  const out = {};
  for (const kind of Object.keys(GEMS)) {
    renderer.toneMappingExposure = GEMS[kind].exposure;
    renderer.setClearColor(0x000000, 0);
    renderer.clear();
    renderer.render(build(kind), camera);
    out[kind] = renderer.domElement.toDataURL("image/png");
  }
  return out;
};
window.ready = true;
</script>
