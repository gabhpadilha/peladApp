<!doctype html>
<meta charset="utf-8">
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js"}}</script>
<body style="margin:0;background:#000">
<script type="module">
import * as THREE from "three";

const SIZE = 512;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(SIZE, SIZE);
renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

/** Estúdio de joalheria: caixas de luz brancas e faixas coloridas num fundo escuro, para reflexos nítidos nas facetas. */
function studio() {
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x05070a);
  let seed = 7;
  const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  // Domo com degradê suave (para o corpo da pedra não ficar chapado) e dezenas de faixas de luz finas e fortes (os brilhos das facetas).
  const dome = new THREE.Mesh(new THREE.SphereGeometry(30, 48, 32), new THREE.ShaderMaterial({
    side: THREE.BackSide, toneMapped: false,
    vertexShader: "varying vec3 p; void main(){ p = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }",
    fragmentShader: "varying vec3 p; void main(){ float t = p.y*0.5+0.5; vec3 c = mix(vec3(0.02,0.03,0.04), vec3(0.55,0.6,0.7), pow(t,3.0)); gl_FragColor = vec4(c,1.0); }",
  }));
  scene.add(dome);
  for (let i = 0; i < 46; i++) {
    const theta = rand() * Math.PI * 2;
    const phi = Math.acos(1 - rand() * 1.6);
    const r = 22;
    const pos = [r * Math.sin(phi) * Math.cos(theta), r * Math.cos(phi), r * Math.sin(phi) * Math.sin(theta)];
    const w = 0.4 + rand() * 1.6;
    const h = 2 + rand() * 9;
    const warm = rand() > 0.55;
    const k = 2 + rand() * 6;
    const rgb = warm ? [k, k * 0.86, k * 0.62] : [k * 0.8, k * 0.92, k];
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(...rgb), side: THREE.DoubleSide, toneMapped: false }));
    mesh.position.set(...pos);
    mesh.lookAt(0, 0, 0);
    mesh.rotateZ(rand() * Math.PI);
    scene.add(mesh);
  }
  return scene;
}
const pmrem = new THREE.PMREMGenerator(renderer);
const env = pmrem.fromScene(studio(), 0.01, 0.1, 100).texture;

/** Cristal alongado de 6 faces com as duas pontas lapidadas (o mesmo formato nas quatro raridades; muda só a cor). */
function crystalGeometry() {
  const profile = [
    [0.0, -2.7],
    [0.34, -1.9],
    [0.62, -1.25],
    [0.64, -1.1],
    [0.64, 1.1],
    [0.62, 1.25],
    [0.34, 1.9],
    [0.0, 2.7],
  ].map(([x, y]) => new THREE.Vector2(x, y));
  return new THREE.LatheGeometry(profile, 6);
}

/** Textura de brilho: raio fino e longo com a cor no miolo e as pontas em arco-íris (a difração das referências). */
function streakTexture(rgb, spectral) {
  const c = document.createElement("canvas");
  c.width = 512; c.height = 32;
  const g = c.getContext("2d");
  const grad = g.createLinearGradient(0, 0, 512, 0);
  if (spectral) {
    ["rgba(255,60,60,0)", "rgba(255,160,40,.55)", "rgba(80,255,120,.35)", "rgba(80,140,255,.45)", "rgba(255,255,255,0.0)"].forEach((col, i, arr) => grad.addColorStop(i / (arr.length - 1), col));
  } else {
    grad.addColorStop(0, `rgba(${rgb},0)`);
    grad.addColorStop(0.42, `rgba(${rgb},.55)`);
    grad.addColorStop(0.5, "rgba(255,255,255,1)");
    grad.addColorStop(0.58, `rgba(${rgb},.55)`);
    grad.addColorStop(1, `rgba(${rgb},0)`);
  }
  g.fillStyle = grad;
  g.fillRect(0, 0, 512, 32);
  // afinar na vertical (raio, não faixa)
  const v = g.createLinearGradient(0, 0, 0, 32);
  v.addColorStop(0, "rgba(0,0,0,1)"); v.addColorStop(0.5, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,1)");
  g.globalCompositeOperation = "destination-out";
  g.fillStyle = v; g.fillRect(0, 0, 512, 32);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function glowTexture(rgb) {
  const c = document.createElement("canvas");
  c.width = c.height = 256;
  const g = c.getContext("2d");
  const grad = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  grad.addColorStop(0, "rgba(255,255,255,1)");
  grad.addColorStop(0.18, `rgba(${rgb},.85)`);
  grad.addColorStop(0.5, `rgba(${rgb},.22)`);
  grad.addColorStop(1, `rgba(${rgb},0)`);
  g.fillStyle = grad; g.fillRect(0, 0, 256, 256);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const goldMat = () => new THREE.MeshStandardMaterial({ color: 0xf3c969, metalness: 1, roughness: 0.18, envMap: env, envMapIntensity: 1.6 });

// Um formato só; muda a cor (e o brilho do núcleo): comum quartzo gelo, rara safira, épica ametista, lendária topázio dourado.
const GEMS = {
  comum: { tint: 0xe6edf7, atten: 0x9fb2c8, dist: 4.0, rgb: "190,205,225", core: 0xb7c6da, flare: 0.55, exposure: 1.0 },
  rara: { tint: 0x8fb4ff, atten: 0x1f5bff, dist: 3.0, rgb: "70,130,255", core: 0x2a6bff, flare: 0.8, exposure: 1.0 },
  epica: { tint: 0xd0a0ff, atten: 0xa030ff, dist: 3.0, rgb: "170,90,255", core: 0x9a3cff, flare: 0.9, exposure: 1.0 },
  lendaria: { tint: 0xffdc8a, atten: 0xffae00, dist: 3.0, rgb: "255,190,60", core: 0xffa800, flare: 1.0, exposure: 1.0 },
};

function build(kind, mode) {
  const mask = mode === "mask";
  const flareOnly = mode === "flare";
  const cfg = GEMS[kind];
  const scene = new THREE.Scene();
  scene.environment = mask ? null : env;
  scene.background = new THREE.Color(mask || flareOnly ? 0x000000 : 0x56606c);
  const group = new THREE.Group();

  const gem = new THREE.Mesh(
    crystalGeometry(),
    new THREE.MeshPhysicalMaterial({
      color: cfg.tint, metalness: 0, roughness: 0.02, transmission: 1, thickness: 1.2, ior: 1.6, dispersion: 0.9,
      attenuationColor: new THREE.Color(cfg.atten), attenuationDistance: cfg.dist, specularIntensity: 1, envMap: env, envMapIntensity: 1.1,
      clearcoat: 0.25, clearcoatRoughness: 0.02, flatShading: true, side: THREE.DoubleSide,
    }),
  );
  if (!flareOnly) group.add(gem);

  // Núcleo luminoso por dentro (o que acende o cristal, como nas referências).
  const core = new THREE.Mesh(
    crystalGeometry(),
    new THREE.MeshStandardMaterial({ color: cfg.core, emissive: cfg.core, emissiveIntensity: 1.0, roughness: 0.3, flatShading: true, transparent: true, opacity: 0.4 }),
  );
  core.scale.set(0.34, 0.5, 0.34);
  if (!flareOnly) group.add(core);

  group.rotation.set(0.12, 0.38, 0.1);
  scene.add(group);

  // Brilho e raios de difração (só na imagem colorida; ficam fora da silhueta usada no alfa).
  const flares = new THREE.Group();
  flares.userData.flare = true;
  const additive = { transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false };
  const halo = new THREE.Mesh(new THREE.PlaneGeometry(2.6, 2.6), new THREE.MeshBasicMaterial({ map: glowTexture(cfg.rgb), ...additive, opacity: 0.6 * cfg.flare }));
  halo.position.z = 1.2;
  flares.add(halo);
  const streak = (len, thick, angle, rgb, spectral, opacity) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(len, thick), new THREE.MeshBasicMaterial({ map: streakTexture(rgb, spectral), ...additive, opacity: opacity * cfg.flare }));
    m.rotation.z = angle;
    m.position.z = 1.3;
    flares.add(m);
  };
  streak(7.2, 0.5, Math.PI / 2, cfg.rgb, false, 0.9);
  streak(6.6, 0.45, 0, cfg.rgb, false, 0.85);
  streak(4.6, 0.3, Math.PI / 4, cfg.rgb, true, 0.7);
  streak(4.2, 0.28, -Math.PI / 3.4, cfg.rgb, true, 0.6);
  if (flareOnly) scene.add(flares);
  if (mask) scene.overrideMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
  return scene;
}

const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 60);
camera.position.set(0, 0, 11.5);
camera.lookAt(0, 0, 0);

window.renderAll = () => {
  const out = {};
  for (const kind of Object.keys(GEMS)) {
    renderer.toneMappingExposure = GEMS[kind].exposure;
    const shot = (mode) => { renderer.render(build(kind, mode), camera); return renderer.domElement.toDataURL("image/png"); };
    out[kind] = { color: shot("body"), mask: shot("mask"), flare: shot("flare") };
  }
  return out;
};
window.ready = true;
</script>
